<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Cyan to Neon Blue Frame Gradient -->
    <linearGradient id="cyberFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="35%" stop-color="#00d2ff" />
      <stop offset="85%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Deep Obsidian Mouse Body Gradient -->
    <linearGradient id="cyberBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151b2e" />
      <stop offset="50%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#080b14" />
    </linearGradient>

    <!-- Glowing Scroll Wheel Gradient -->
    <linearGradient id="cyberWheel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Side Buttons Gradient -->
    <linearGradient id="cyberSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- B-Shift Amber Accent Gradient -->
    <linearGradient id="amberAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Crisp Subtle Cyan Shadow -->
    <filter id="crispGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00d2ff" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Mouse Body (Dark Obsidian) -->
  <path d="M280.475,500.622h-48.949c-77.598,0-140.503-62.905-140.503-140.503V176.356 c0-91.114,73.863-164.978,164.978-164.978l0,0c91.114,0,164.978,73.863,164.978,164.978v183.764 C420.978,437.717,358.072,500.622,280.475,500.622z" fill="url(#cyberBody)" />

  <!-- Scroll Wheel (Luminous Cyan) -->
  <path d="M256,215.603L256,215.603c-17.281,0-31.289-14.008-31.289-31.289v-39.822 c0-17.281,14.008-31.289,31.289-31.289l0,0c17.281,0,31.289,14.008,31.289,31.289v39.822 C287.289,201.594,273.281,215.603,256,215.603z" fill="url(#cyberWheel)" />


  <!-- Side Buttons (G5/G4) in Electric Cyan -->
  <path d="M136.533,164.978c-6.283,0-11.378,5.095-11.378,11.378v8.376c0,6.283,5.095,11.378,11.378,11.378 c6.283,0,11.378-5.095,11.378-11.378v-8.376C147.911,170.073,142.816,164.978,136.533,164.978z" fill="url(#cyberSide)" />
